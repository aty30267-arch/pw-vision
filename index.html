<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PW Vision</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
    }
    .card {
      text-align: center;
      padding: 50px 70px;
      border-radius: 24px;
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }
    h1 { font-size: 64px; margin: 0 0 12px; }
    p { font-size: 20px; margin: 0; opacity: .9; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello 👋</h1>
    <p>Welcome to PW Vision</p>
  </main>
</body>
</html>
