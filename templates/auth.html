<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PW Vision Account</title><style>body{margin:0;font-family:Arial;background:#f5f3ff;display:grid;place-items:center;min-height:100vh}.box{width:min(430px,90vw);background:#fff;padding:32px;border-radius:18px;box-shadow:0 15px 45px #0001}h1{color:#5b21b6}input{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}button{width:100%;padding:13px;border:0;border-radius:9px;background:#5b21b6;color:white;font-weight:bold;margin-top:10px}.switch{margin-top:18px;text-align:center;color:#666}</style></head><body><div class="box"><h1 id="title">Login</h1><p>Access your PW Vision learning dashboard.</p><div id="nameWrap" style="display:none"><input id="name" placeholder="Full name"></div><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="submitAuth()" id="submit">Login</button><p id="msg"></p><div class="switch"><span id="switchText">New here?</span> <a href="#" onclick="toggle();return false" id="switchBtn">Create account</a></div></div><script>let signup=false;function toggle(){signup=!signup;document.getElementById('title').textContent=signup?'Create account':'Login';document.getElementById('nameWrap').style.display=signup?'block':'none';document.getElementById('submit').textContent=signup?'Sign up':'Login';document.getElementById('switchText').textContent=signup?'Already have an account?':'New here?';document.getElementById('switchBtn').textContent=signup?'Login':'Create account'}async function submitAuth(){let body={email:email.value,password:password.value};if(signup)body.name=name.value;let r=await fetch(signup?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();msg.textContent=d.error||'Success! Redirecting...';if(r.ok)setTimeout(()=>location.href='/',500)}</script></body></html>
