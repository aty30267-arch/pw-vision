<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PW Vision | Instagram Downloader</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#fafafa;color:#111;display:flex;justify-content:center;align-items:center;padding:24px}.wrap{width:min(760px,100%)}.brand{font-weight:900;font-size:28px;margin-bottom:34px;text-align:center}.card{background:#fff;border:1px solid #e7e7e7;border-radius:22px;padding:42px 34px;box-shadow:0 14px 40px rgba(0,0,0,.06);text-align:center}.icon{width:68px;height:68px;border-radius:18px;margin:0 auto 20px;display:grid;place-items:center;background:#111;color:#fff;font-weight:900;font-size:24px}.card h1{margin:0 0 10px;font-size:34px}.card p{margin:0 auto 28px;color:#6f7178;max-width:560px;line-height:1.6}.row{display:flex;gap:10px}.url{flex:1;height:54px;padding:0 16px;border:1px solid #d8dbe1;border-radius:12px;font-size:16px;outline:none}.url:focus{border-color:#111}.btn{height:54px;padding:0 24px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.btn:hover{opacity:.9}.error{margin-top:16px;color:#c62828;font-size:14px}.hint{margin-top:25px!important;font-size:13px!important;color:#999!important}@media(max-width:620px){.card{padding:32px 20px}.card h1{font-size:28px}.row{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<div class="wrap"><div class="brand">PW Vision</div><main class="card"><div class="icon">IG</div><h1>Instagram Downloader</h1><p>Paste an Instagram Reel or public post link below and download the available video.</p><form class="row" action="/download" method="post"><input class="url" type="url" name="url" placeholder="https://www.instagram.com/reel/..." required><button class="btn" type="submit">Download</button></form>{% if error %}<div class="error">{{ error }}</div>{% endif %}<p class="hint">Only download content you have permission to save. Public links work best.</p></main></div>
</body></html>
